<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NetSage AI</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%234DE8D4'><path d='M21 11.01h-3V7c0-1.1-.9-2-2-2h-4.01V2h-2v3H7c-1.1 0-2 .9-2 2v4.01H2v2h3V16c0 1.1.9 2 2 2h4.01v3h2v-3H16c1.1 0 2-.9 2-2v-4.01h3v-2zM16 16H7V7h9v9z'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#0A0D12;
    --panel:#12161D;
    --panel-raised:#1A2029;
    --user-bubble:#1E2938;
    --border:#232B36;
    --signal:#4DE8D4;
    --signal-dim:#2A6B63;
    --alert:#FFB454;
    --text-primary:#E8EDF2;
    --text-dim:#6B7684;
    --danger:#FF6B6B;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--void);
    background-image:
      radial-gradient(circle at 15% 0%, rgba(77,232,212,0.06), transparent 45%),
      radial-gradient(circle at 85% 100%, rgba(255,180,84,0.04), transparent 40%);
    color:var(--text-primary);
    font-family:'Inter', sans-serif;
    display:flex;
    flex-direction:column;
    height:100vh;
    overflow:hidden;
  }

  /* ---------- Header ---------- */
  header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:14px 22px;
    border-bottom:1px solid var(--border);
    background:rgba(18,22,29,0.85);
    backdrop-filter:blur(6px);
    flex-shrink:0;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:12px;
  }
  .brand-title{
    font-family:'IBM Plex Mono', monospace;
    font-size:15px;
    font-weight:600;
    letter-spacing:0.04em;
    color:var(--text-primary);
  }
  .brand-title span{ color:var(--signal); }
  .brand-sub{
    font-family:'IBM Plex Mono', monospace;
    font-size:10.5px;
    color:var(--text-dim);
    letter-spacing:0.06em;
    text-transform:uppercase;
    margin-top:2px;
  }

  /* Signal bars — the signature element: idles low, climbs while the agent thinks/streams */
  .signal-bars{
    display:flex;
    align-items:flex-end;
    gap:3px;
    height:16px;
  }
  .signal-bars .bar{
    width:3px;
    background:var(--signal-dim);
    border-radius:1px;
    transition:background 0.25s ease;
  }
  .signal-bars .bar:nth-child(1){height:5px;}
  .signal-bars .bar:nth-child(2){height:8px;}
  .signal-bars .bar:nth-child(3){height:11px;}
  .signal-bars .bar:nth-child(4){height:16px;}
  .signal-bars.active .bar{
    background:var(--signal);
    animation:pulse 1.1s ease-in-out infinite;
  }
  .signal-bars.active .bar:nth-child(1){animation-delay:0s;}
  .signal-bars.active .bar:nth-child(2){animation-delay:0.12s;}
  .signal-bars.active .bar:nth-child(3){animation-delay:0.24s;}
  .signal-bars.active .bar:nth-child(4){animation-delay:0.36s;}
  @keyframes pulse{
    0%,100%{opacity:0.35; transform:scaleY(0.7);}
    50%{opacity:1; transform:scaleY(1);}
  }

  .header-right{ display:flex; align-items:center; gap:16px; }
  .status-dot{
    width:7px; height:7px; border-radius:50%;
    background:var(--signal);
    box-shadow:0 0 6px var(--signal);
  }
  .status-text{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color:var(--text-dim);
  }
  .reset-btn{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color:var(--text-dim);
    background:transparent;
    border:1px solid var(--border);
    border-radius:6px;
    padding:6px 10px;
    cursor:pointer;
    transition:all 0.15s ease;
  }
  .reset-btn:hover{ color:var(--text-primary); border-color:var(--signal-dim); }

  /* ---------- Message log ---------- */
  #log{
    flex:1;
    overflow-y:auto;
    padding:24px 18px 12px;
    display:flex;
    flex-direction:column;
    gap:16px;
    max-width:860px;
    width:100%;
    margin:0 auto;
  }
  .row{ display:flex; }
  .row.user{ justify-content:flex-end; }
  .row.agent{ justify-content:flex-start; }

  .bubble{
    max-width:78%;
    padding:12px 15px;
    border-radius:10px;
    font-size:14px;
    line-height:1.55;
    white-space:pre-wrap;
    word-wrap:break-word;
  }
  .row.user .bubble{
    background:var(--user-bubble);
    border:1px solid var(--border);
    border-bottom-right-radius:3px;
  }
  .row.agent .bubble{
    background:var(--panel);
    border:1px solid var(--border);
    border-bottom-left-radius:3px;
  }
  .agent-label{
    font-family:'IBM Plex Mono', monospace;
    font-size:10px;
    color:var(--signal);
    letter-spacing:0.08em;
    text-transform:uppercase;
    margin-bottom:6px;
    display:block;
  }

  .tool-chip{
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-family:'IBM Plex Mono', monospace;
    font-size:10.5px;
    color:var(--alert);
    background:rgba(255,180,84,0.08);
    border:1px solid rgba(255,180,84,0.25);
    border-radius:5px;
    padding:3px 8px;
    margin:2px 6px 8px 0;
  }
  .tool-chip::before{ content:"⚡"; font-size:9px; }

  .cursor{
    display:inline-block;
    width:7px; height:14px;
    background:var(--signal);
    margin-left:2px;
    vertical-align:middle;
    animation:blink 0.9s step-start infinite;
  }
  @keyframes blink{ 50%{ opacity:0; } }

  #log::-webkit-scrollbar{ width:8px; }
  #log::-webkit-scrollbar-thumb{ background:var(--border); border-radius:4px; }

  .empty-state{
    margin:auto;
    text-align:center;
    color:var(--text-dim);
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    line-height:2;
  }
  .empty-state .big{
    font-size:14px;
    color:var(--text-primary);
    margin-bottom:6px;
  }

  /* ---------- Input bar ---------- */
  .input-wrap{
    border-top:1px solid var(--border);
    background:rgba(18,22,29,0.9);
    padding:14px 18px 18px;
    flex-shrink:0;
  }
  .input-inner{
    max-width:860px;
    margin:0 auto;
    display:flex;
    align-items:flex-end;
    gap:10px;
    background:var(--panel-raised);
    border:1px solid var(--border);
    border-radius:12px;
    padding:8px 8px 8px 14px;
    transition:border-color 0.15s ease;
  }
  .input-inner:focus-within{ border-color:var(--signal-dim); }
  textarea{
    flex:1;
    background:transparent;
    border:none;
    outline:none;
    resize:none;
    color:var(--text-primary);
    font-family:'Inter', sans-serif;
    font-size:14px;
    line-height:1.5;
    max-height:140px;
    padding:8px 0;
  }
  textarea::placeholder{ color:var(--text-dim); }
  #send-btn{
    background:var(--signal);
    border:none;
    border-radius:8px;
    width:36px; height:36px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    flex-shrink:0;
    transition:opacity 0.15s ease, transform 0.1s ease;
  }
  #send-btn:hover{ opacity:0.88; }
  #send-btn:active{ transform:scale(0.94); }
  #send-btn:disabled{ opacity:0.35; cursor:not-allowed; }
  #send-btn svg{ width:16px; height:16px; }

  .hint{
    max-width:860px;
    margin:8px auto 0;
    font-family:'IBM Plex Mono', monospace;
    font-size:10.5px;
    color:var(--text-dim);
    padding:0 4px;
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="signal-bars" id="signal-bars">
      <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
    </div>
    <div>
      <div class="brand-title">NetSage <span>AI</span></div>
      <div class="brand-sub">5G SA Core &middot; Open5GS / UERANSIM</div>
    </div>
  </div>
  <div class="header-right">
    <div style="display:flex; align-items:center; gap:6px;">
      <div class="status-dot"></div>
      <span class="status-text" id="status-text">READY</span>
    </div>
    <button class="reset-btn" id="reset-btn">RESET SESSION</button>
    <a href="/" class="reset-btn" style="text-decoration:none;">← DASHBOARD</a>
  </div>
</header>

<div id="log">
  <div class="empty-state" id="empty-state">
    <div class="big">NetSage AI is standing by.</div>
    <div>"start the core" &middot; "check amf logs" &middot; "what's the current registered UE count"</div>
    <div>"launch 2 gnbs with 2 ues each" &middot; "is throughput normal on gnb 1"</div>
  </div>
</div>

<div class="input-wrap">
  <div class="input-inner">
    <textarea id="input" rows="1" placeholder="Ask NetSage AI about the network, or tell it what to deploy..."></textarea>
    <button id="send-btn" aria-label="Send">
      <svg viewBox="0 0 24 24" fill="none"><path d="M4 12L20 4L14 20L11 13L4 12Z" stroke="#0A0D12" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg>
    </button>
  </div>
  <div class="hint">Enter to send &middot; Shift+Enter for newline</div>
</div>

<script>
const log = document.getElementById('log');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send-btn');
const resetBtn = document.getElementById('reset-btn');
const signalBars = document.getElementById('signal-bars');
const statusText = document.getElementById('status-text');
const emptyState = document.getElementById('empty-state');

const sessionId = 'netsage-' + Math.random().toString(36).slice(2, 10);
let busy = false;

function autoGrow(){
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 140) + 'px';
}
input.addEventListener('input', autoGrow);
input.addEventListener('keydown', (e) => {
  if(e.key === 'Enter' && !e.shiftKey){
    e.preventDefault();
    sendMessage();
  }
});
sendBtn.addEventListener('click', sendMessage);
resetBtn.addEventListener('click', async () => {
  await fetch('/api/ai/reset', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({session_id: sessionId})
  });
  log.innerHTML = '';
  log.appendChild(emptyState);
});

function setBusy(state){
  busy = state;
  sendBtn.disabled = state;
  signalBars.classList.toggle('active', state);
  statusText.textContent = state ? 'THINKING' : 'READY';
}

function addUserMessage(text){
  emptyState.remove();
  const row = document.createElement('div');
  row.className = 'row user';
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = text;
  row.appendChild(bubble);
  log.appendChild(row);
  log.scrollTop = log.scrollHeight;
}

function addAgentMessage(){
  const row = document.createElement('div');
  row.className = 'row agent';
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  const label = document.createElement('span');
  label.className = 'agent-label';
  label.textContent = 'NetSage AI';
  bubble.appendChild(label);

  const toolWrap = document.createElement('div');
  const textNode = document.createElement('span');
  const cursor = document.createElement('span');
  cursor.className = 'cursor';

  bubble.appendChild(toolWrap);
  bubble.appendChild(textNode);
  bubble.appendChild(cursor);
  row.appendChild(bubble);
  log.appendChild(row);
  log.scrollTop = log.scrollHeight;

  return { toolWrap, textNode, cursor };
}

async function sendMessage(){
  const text = input.value.trim();
  if(!text || busy) return;

  addUserMessage(text);
  input.value = '';
  autoGrow();
  setBusy(true);

  const { toolWrap, textNode, cursor } = addAgentMessage();
  let fullText = '';

  try {
    const resp = await fetch('/api/ai/chat', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ message: text, session_id: sessionId })
    });

    if(!resp.ok || !resp.body){
      textNode.textContent = 'Error: could not reach the agent backend.';
      cursor.remove();
      setBusy(false);
      return;
    }

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while(true){
      const { done, value } = await reader.read();
      if(done) break;
      buffer += decoder.decode(value, { stream: true });

      const parts = buffer.split('\n\n');
      buffer = parts.pop();

      for(const part of parts){
        const line = part.trim();
        if(!line.startsWith('data:')) continue;
        const jsonStr = line.slice(5).trim();
        if(!jsonStr) continue;

        let evt;
        try { evt = JSON.parse(jsonStr); } catch(e){ continue; }

        if(evt.type === 'tool'){
          const chip = document.createElement('span');
          chip.className = 'tool-chip';
          chip.textContent = evt.name;
          toolWrap.appendChild(chip);
          log.scrollTop = log.scrollHeight;
        } else if(evt.type === 'token'){
          fullText += evt.text;
          textNode.textContent = fullText;
          log.scrollTop = log.scrollHeight;
        } else if(evt.type === 'done'){
          cursor.remove();
        }
      }
    }
  } catch(err){
    textNode.textContent = (fullText ? fullText + '\n\n' : '') + '[connection lost: ' + err + ']';
    cursor.remove();
  }

  setBusy(false);
}

input.focus();
</script>

</body>
</html>
